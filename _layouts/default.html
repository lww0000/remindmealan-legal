<!DOCTYPE html>
<html lang="{% if page.url contains '-sv' %}sv{% else %}en{% endif %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} – {% endif %}Remind Me Alan</title>
<style>
  :root { --orange:#F4581C; --peach:#FFC79C; --text:#1F1F1F; --muted:#6B6B6B; --card:#FFF6EF; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); background:#fff; line-height:1.65; }
  header { background:linear-gradient(135deg,var(--orange),#FF8A4C); color:#fff; text-align:center; padding:36px 20px 30px; }
  header a { color:#fff; text-decoration:none; }
  .logo { width:64px; height:64px; margin:0 auto 10px; background:var(--peach); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:36px; box-shadow:0 6px 18px rgba(0,0,0,.15); }
  .brand { font-size:20px; font-weight:700; }
  main { max-width:720px; margin:0 auto; padding:28px 20px 40px; }
  main h1 { font-size:28px; line-height:1.25; margin:0 0 20px; }
  main h2 { font-size:20px; margin:32px 0 10px; padding-top:16px; border-top:2px solid var(--card); color:var(--orange); }
  main h3 { font-size:17px; margin:22px 0 6px; }
  main p, main li { color:#333; }
  main ul, main ol { padding-left:22px; }
  main a { color:var(--orange); word-break:break-word; }
  main table { width:100%; border-collapse:collapse; margin:16px 0; font-size:15px; display:block; overflow-x:auto; }
  main th, main td { border:1px solid #eee; padding:8px 10px; text-align:left; vertical-align:top; }
  main th { background:var(--card); }
  main blockquote { margin:16px 0; padding:12px 16px; background:var(--card); border-left:4px solid var(--orange); border-radius:8px; }
  main code { background:var(--card); padding:2px 6px; border-radius:6px; }
  footer { text-align:center; color:var(--muted); font-size:14px; padding:0 20px 36px; }
  footer a { color:var(--orange); }
</style>
</head>
<body>
<header>
  <a href="{{ '/support' | relative_url }}">
    <div class="logo">🐘</div>
    <div class="brand">Remind Me Alan</div>
  </a>
</header>
<main>
{{ content }}
</main>
<footer>
{% if page.url contains '-sv' %}
  <a href="{{ '/privacy-policy-sv' | relative_url }}">Integritetspolicy</a> · <a href="{{ '/terms-of-use-sv' | relative_url }}">Användarvillkor</a> · <a href="{{ '/support' | relative_url }}">Support</a>
{% else %}
  <a href="{{ '/privacy-policy-en' | relative_url }}">Privacy Policy</a> · <a href="{{ '/terms-of-use-en' | relative_url }}">Terms of Use</a> · <a href="{{ '/support' | relative_url }}">Support</a>
{% endif %}
</footer>
</body>
</html>
